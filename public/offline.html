<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071022">
  <title>SecureLink · Offline</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f6f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0,#edf2ff,transparent 35%),#f6f7fb}
    main{width:min(520px,100%);padding:34px;border:1px solid #e6eaf0;border-radius:28px;background:#fff;box-shadow:0 28px 80px rgba(16,24,40,.08)}
    .mark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#071022;color:#fff;font-weight:900;margin-bottom:28px}
    h1{font-size:44px;line-height:.95;letter-spacing:-.055em;margin:0 0 16px}p{color:#667085;line-height:1.6}
    button{border:0;border-radius:14px;padding:14px 18px;background:#101828;color:#fff;font-weight:800}
  </style>
</head>
<body><main><div class="mark">SL</div><h1>You’re offline.</h1><p>SecureLink keeps private account and order pages network-only. Reconnect to view live offers, account details or order status.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
