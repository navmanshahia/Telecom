name: Next Three GSAP CI

on:
  push:
    branches:
      - next-three-gsap
    paths:
      - "next-web/**"
      - ".github/workflows/next-three-gsap-ci.yml"
  pull_request:
    paths:
      - "next-web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
