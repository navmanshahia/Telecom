name: Production checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sodium
      - name: Lint PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate PWA manifest
        run: php -r '$j=json_decode(file_get_contents("public/manifest.webmanifest"),true); if(!is_array($j)){fwrite(STDERR,json_last_error_msg().PHP_EOL); exit(1);} echo "manifest ok".PHP_EOL;'
      - name: Check JavaScript syntax
        run: |
          node --check public/assets/portal.js
          node --check public/service-worker.js
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
